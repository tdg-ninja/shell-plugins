name: Shell Plugin Factory Cloud Run

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated target CLI integrations"
        required: true
        default: "supabase, planetscale, render"
      agent:
        description: "Tessl cloud-capable agent"
        required: true
        default: "tessl-agent"
        type: choice
        options:
          - tessl-agent
          - claude-code
          - codex
          - cursor
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  launch-cloud-factory:
    name: Launch Tessl cloud factory
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'shell-plugin-factory')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse target list
        id: targets
        env:
          TARGETS: ${{ github.event.inputs.targets || '' }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
        run: |
          python3 harness/shell-plugin-factory/parse_issue_targets.py

      - name: Show cloud launch instructions
        run: |
          cat harness/shell-plugin-factory/cloud-agent-instructions.md

      - name: Install Tessl CLI
        uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Install Tessl dependencies
        run: tessl install

      - name: Launch cloud sandbox factory run
        id: launch
        env:
          CLOUD_AGENT: ${{ github.event.inputs.agent || 'tessl-agent' }}
        run: |
          set -euo pipefail
          tessl launch skill tessl-gtm/1password-shell-plugin-codex#author-shell-plugin \
            --cloud \
            --repo "${{ github.repository }}" \
            --base-branch "${{ github.ref_name }}" \
            --agent "$CLOUD_AGENT" \
            --wait \
            --label "shell-plugin-factory:${{ steps.targets.outputs.target_list }}" \
            --instructions "Read harness/shell-plugin-factory/cloud-agent-instructions.md. Run it for targets: ${{ steps.targets.outputs.target_list }}. If this came from issue #${{ github.event.issue.number || 'manual' }}, report back with outcomes and gate evidence." \
            --json | tee cloud-launch.json

      - name: Add cloud run summary
        if: always()
        run: |
          {
            echo "# Shell Plugin Factory Cloud Run"
            echo
            echo "**Repository:** ${{ github.repository }}"
            echo "**Targets:** ${{ steps.targets.outputs.target_list }}"
            echo "**Agent:** ${{ github.event.inputs.agent || 'tessl-agent' }}"
            echo
            echo "This run launches a Tessl cloud sandbox so the requester does not need local agent CLIs, Go tooling, or repo dependencies installed."
            echo
            echo "## Raw launch output"
            echo
            echo '```json'
            if [[ -f cloud-launch.json ]]; then
              cat cloud-launch.json
            else
              echo '{"error":"cloud-launch.json was not produced"}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shell-plugin-factory-cloud-run -->';
            const targets = '${{ steps.targets.outputs.target_list }}';
            const status = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const raw = fs.existsSync('cloud-launch.json') ? fs.readFileSync('cloud-launch.json', 'utf8') : 'cloud-launch.json was not produced';
            const body = `${marker}\n## Shell Plugin Factory Cloud Run\n\n- **Targets:** ${targets}\n- **Status:** ${status}\n- **Actions run:** ${runUrl}\n\nThis launched a Tessl cloud sandbox so the requester does not need local agent CLIs, Go tooling, or repo dependencies installed.\n\n<details><summary>Raw launch output</summary>\n\n\`\`\`json\n${raw.slice(0, 50000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
