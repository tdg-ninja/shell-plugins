name: tessl - Shell Plugin Factory Demo

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "harness/shell-plugin-factory/**"
      - "plugins/supabase/**"
      - "plugins/planetscale/**"
      - "plugins/render/**"
      - ".github/workflows/shell-plugin-factory-demo.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  demo-receipt:
    name: Factory receipt and gate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm fork scope
        run: |
          echo "origin=$(git config --get remote.origin.url)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow is a demo receipt for the tdg-ninja/shell-plugins fork. It does not push, merge, or open upstream PRs." >> "$GITHUB_STEP_SUMMARY"
          git remote -v

      - name: Build GitHub summary from factory report
        run: |
          python3 harness/shell-plugin-factory/github-summary.py

      - name: Validate generated plugin directories
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          summary_file="harness/shell-plugin-factory/validation-summary.md"
          : > "$summary_file"

          for plugin in supabase planetscale render; do
            if [[ -d "plugins/$plugin" ]]; then
              echo "## make $plugin/validate" | tee -a "$summary_file"
              echo '```text' | tee -a "$summary_file"
              make "$plugin/validate" 2>&1 | tee "harness/shell-plugin-factory/${plugin}-validate-live.log"
              status=${PIPESTATUS[0]}
              cat "harness/shell-plugin-factory/${plugin}-validate-live.log" >> "$summary_file"
              echo '```' | tee -a "$summary_file"
              echo | tee -a "$summary_file"
              if [[ "$status" -ne 0 ]]; then
                exit "$status"
              fi
            else
              echo "## make $plugin/validate" | tee -a "$summary_file"
              echo "Skipped: plugins/$plugin is not present in this checkout." | tee -a "$summary_file"
              echo | tee -a "$summary_file"
            fi
          done

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload factory demo artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-plugin-factory-demo
          path: |
            harness/shell-plugin-factory/latest-report.md
            harness/shell-plugin-factory/github-summary.md
            harness/shell-plugin-factory/validation-summary.md
            harness/shell-plugin-factory/*-validate-live.log
            harness/shell-plugin-factory/runs/**
          if-no-files-found: warn

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shell-plugin-factory-demo-summary -->';
            const summaryPath = 'harness/shell-plugin-factory/github-summary.md';
            let body = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : `${marker}\n# Shell Plugin Factory Demo\n\nSummary file was not generated.`;

            if (body.length > 60000) {
              body = body.slice(0, 59000) + '\n\n_Output truncated; see workflow artifacts for full report._';
            }

            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number, per_page: 100});
            const previous = comments.data.find(comment => comment.body && comment.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({owner, repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
